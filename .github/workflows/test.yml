name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      # Windows shells do not expand globs and Node.js < 21 has no --test
      # glob support; the runner expands the test file list itself.
      - run: node scripts/run-tests.js vscode-extension/test
      - run: npm pack --dry-run
